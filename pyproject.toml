[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netease-music-insight"
version = "1.1.0"
description = "Export NetEase and QQ Music account data for AI analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "rhr-jz"}]
dependencies = ["requests>=2.31,<3", "qrcode[pil]>=8,<9", "qqmusic-api-python==0.7.3"]

[project.scripts]
netease-music-insight = "netease_music_insight.cli:main"
music-insight = "netease_music_insight.cli:main"

[tool.setuptools.packages.find]
include = ["netease_music_insight*"]
