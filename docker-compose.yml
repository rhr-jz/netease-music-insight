services:
  music-insight:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      MUSIC_INSIGHT_NETEASE_API_DIR: /opt/netease-api
      MUSIC_INSIGHT_TEMP_ROOT: /tmp/music-insight
      MUSIC_INSIGHT_LOG_DIR: /tmp/music-insight-logs
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=1073741824
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
