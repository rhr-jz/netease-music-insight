name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt -r requirements-test.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python run_desktop.py --smoke
      - run: python run_desktop.py --web-smoke
      - run: python run_web.py --smoke
      - run: pyinstaller --onedir --windowed --clean --noupx --name MusicInsight --collect-all webview --collect-all qqmusic_api --add-data "netease_music_insight/frontend;netease_music_insight/frontend" run_desktop.py
      - name: Check packaged GUI entry point
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/MusicInsight/MusicInsight.exe').Path
          foreach ($argument in @('--smoke', '--web-smoke', '--version')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "MusicInsight.exe $argument failed with $($process.ExitCode)" }
          }
      - name: Package and check Windows files
        shell: pwsh
        run: |
          Copy-Item docs/PORTABLE_START.txt dist/MusicInsight/START_HERE.txt
          Copy-Item LICENSE dist/MusicInsight/LICENSE.txt
          Copy-Item LICENSE_MIT_ORIGINAL dist/MusicInsight/LICENSE_MIT_ORIGINAL.txt
          Copy-Item THIRD_PARTY_LICENSES.md dist/MusicInsight/THIRD_PARTY_LICENSES.md
          Compress-Archive -Path dist/MusicInsight -DestinationPath dist/MusicInsight-Windows-Portable.zip
          $scanPath = (Resolve-Path dist).Path
          $defender = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($defender -and $defender.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $scanPath
          }
          $assets = @('MusicInsight-Windows-Portable.zip')
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath (Join-Path 'dist' $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          Set-Content -LiteralPath dist/SHA256SUMS.txt -Value $checksums -Encoding ascii
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/MusicInsight-Windows-Portable.zip dist/SHA256SUMS.txt --title "Music Insight ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
